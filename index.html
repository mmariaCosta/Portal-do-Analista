<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================
         Segurança: Content Security Policy
         Bloqueia execução de scripts externos e inline
         (exceto onde permitido explicitamente)
         ============================================ -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data:;
        connect-src 'self';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
      " />

    <!-- Impede que o navegador "adivinhe" o tipo de arquivo -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Impede a página de ser embutida em iframe (clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Não vaza URL completa para sites externos -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Desativa APIs sensíveis (câmera, microfone, geolocalização) -->
    <meta http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=()" />

    <script>
    (function() {
      try {
        var t = localStorage.getItem('@pw_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
    <title>Protheus Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
